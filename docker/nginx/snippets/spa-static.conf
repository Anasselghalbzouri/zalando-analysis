# Production-like: serve the built SPA (frontend/dist, from `npm run build`).
# Unknown paths fall back to index.html so client-side routes survive a refresh.
root /usr/share/nginx/spa;

location / {
    try_files $uri $uri/ /index.html;
}

# index.html must always be revalidated so a new build is picked up.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Content-hashed build assets (NFR-CACHE-01).
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
