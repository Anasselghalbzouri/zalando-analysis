# Development: proxy the SPA to the Vite dev server, including the HMR websocket.
# Vite answers unknown paths with index.html, so client-side routes survive a refresh.
location / {
    set $vite_upstream http://vite:5173;
    proxy_pass $vite_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}
