; Local development PHP settings.
memory_limit = 256M
; Keep in line with client_max_body_size in docker/nginx/templates/default.conf.template.
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off
date.timezone = UTC

; OPcache on, but re-validate files on every request so code edits apply at once.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
